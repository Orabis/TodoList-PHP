services:
  postgres:
    image: postgres:17
    container_name: todo-list
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: todo-adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
    driver: local